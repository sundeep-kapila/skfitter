# MnTe altermagnet, Mn s d (A1, E1, E2) and Te pz / pxy: per shell, whole orbital families
# skfitter fit steps/shell.toml (from the example folder)

name = "mnte_shell"
output = "../out"

[dft]
code = "espresso"
xml = "../data/qe_bands.xml.gz"
bands_in = "../data/qe_bands.in"
scf = "../data/qe_scf.out"
projwfc = "../data/qe_projwfc_up.gz"

[model]
orbitals = { Mn = ["s", "d"], Te = ["p"] }
magnetic_orbitals = { Mn = ["d"] }
bands_below = 22
bands_above = 8
neighbours = 5
hopping = "shell"
soc = false
overlap = false
fit_eta = false
eta = 2.5

[fit]
method = "ls"
starts = 8
seed = 0
refine_max_nfev = 300
fermi_weight = 10
fermi_window = 1.5
start_from = "../out/mnte_decay_fit.json"

# exchange splitting of Mn 3d: >= 3 eV (the default bound, +-5 eV, is below its value of about 7 eV)
[fit.bounds]
delta_spin_Mn_d = [3, 12]
