# MnTe altermagnet, Mn s d (A1, E1, E2) and Te pz / pxy
# The model of the SKFitter paper (Table 1). The fit starts from the published parameters
# (reference/); skfitter fit gives the RMSE of the paper. See README.md for a fit from scratch.

name = "mnte"
output = "out"

[dft]
code = "espresso"
xml = "data/qe_bands.xml.gz"
bands_in = "data/qe_bands.in"
scf = "data/qe_scf.out"
projwfc = "data/qe_projwfc_up.gz"

[model]
orbitals = { Mn = ["s", "dz2", "d_e1", "d_e2"], Te = ["pz", "pxy"] }
magnetic_orbitals = { Mn = ["dz2", "d_e1", "d_e2"] }
bands_below = 22
bands_above = 8
neighbours = 5
hopping = "shell"
soc = false
overlap = false
fit_eta = false
eta = 2.5

[fit]
method = "ls"
starts = 2
seed = 0
refine_max_nfev = 300
fermi_weight = 10
fermi_window = 1.5
start_from = "reference/mnte_fit.json"

# exchange splitting of Mn 3d: >= 3 eV (the default bound, +-5 eV, is below its value of about 7 eV)
[fit.bounds]
delta_spin_Mn_dz2 = [3, 12]
delta_spin_Mn_d_e1 = [3, 12]
delta_spin_Mn_d_e2 = [3, 12]
