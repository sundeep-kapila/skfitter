# bcc Fe, s p d (t2g, eg), ferromagnetic with spin-orbit coupling
# The model of the SKFitter paper (Table 1). The fit starts from the published parameters
# (reference/); skfitter fit gives the RMSE of the paper. See README.md for a fit from scratch.

name = "iron"
output = "out"

[dft]
code = "espresso"
xml = "data/qe_bands.xml"
bands_in = "data/qe_bands.in"
scf = "data/qe_scf.out"
projwfc = "data/qe_projwfc_up.gz"

[model]
orbitals = { Fe = ["s", "p", "d_t2g", "d_eg"] }
magnetic_orbitals = { Fe = ["s", "d_t2g", "d_eg"] }
bands_below = 4
bands_above = 1
neighbours = 4
hopping = "shell"
soc = true
overlap = false
fit_eta = true

[fit]
method = "ls"
starts = 2
seed = 0
refine_max_nfev = 300
fermi_weight = 30
fermi_window = 1
start_from = "reference/iron_fit.json"

[fit.fix]
lambda_Fe_d = 0.057
lambda_Fe_p = 0

# anomalous Hall conductivity of the fitted model (Fig. 3a)
[[property]]
type = "ahc"
nk = [40, 40, 40]
emin = -2.0
emax = 2.0
num_efermi = 201

# the same with lambda(Fe, d) = 0 eV (Fig. 3b)
[[property]]
type = "ahc"
label = "lambda_0"
nk = [40, 40, 40]
emin = -0.2
emax = 0.2
num_efermi = 21
parameters = { lambda_Fe_d = 0.0 }

# the same with lambda(Fe, d) = 0.005 eV (Fig. 3b)
