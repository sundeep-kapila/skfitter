# 2H-MoS2, Mo d (A1, E', E'') and S pz / pxy, spin-orbit coupling: decay law, whole orbital families
# skfitter fit steps/decay.toml (from the example folder)

name = "mos2_decay"
output = "../out"

[dft]
code = "espresso"
xml = "../data/qe_bands.xml.gz"
bands_in = "../data/qe_bands.in"
scf = "../data/qe_scf.out"
projwfc = "../data/qe_projwfc_up.gz"

[model]
orbitals = { Mo = ["d"], S = ["p"] }
bands_below = 4
bands_above = 2
neighbours = 9
hopping = "decay"
soc = true
overlap = false
electrons = 28
fit_eta = true

[fit]
method = "ls"
starts = 8
seed = 0
refine_max_nfev = 400
fermi_weight = 60
fermi_window = 0.7
start_set = "harrison"
