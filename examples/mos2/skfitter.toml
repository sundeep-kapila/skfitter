# 2H-MoS2, Mo d (A1, E', E'') and S pz / pxy, spin-orbit coupling
# The model of the SKFitter paper (Table 1). The fit starts from the published parameters
# (reference/); skfitter fit gives the RMSE of the paper. See README.md for a fit from scratch.

name = "mos2"
output = "out"

[dft]
code = "espresso"
xml = "data/qe_bands.xml.gz"
bands_in = "data/qe_bands.in"
scf = "data/qe_scf.out"
projwfc = "data/qe_projwfc_up.gz"

[model]
orbitals = { Mo = ["dz2", "d_e2", "d_e1"], S = ["pxy", "pz"] }
bands_below = 4
bands_above = 2
neighbours = 9
hopping = "shell"
soc = true
overlap = false
electrons = 28
fit_eta = false
eta = 2.5

[fit]
method = "ls"
starts = 2
seed = 0
refine_max_nfev = 400
fermi_weight = 60
fermi_window = 0.7
start_from = "reference/mos2_fit.json"
