# fcc Pt, s p d with spin-orbit coupling: per shell, whole orbital families
# skfitter fit steps/shell.toml (from the example folder)

name = "platinum_shell"
output = "../out"

[dft]
code = "espresso"
xml = "../data/qe_bands.xml"
bands_in = "../data/qe_bands.in"
scf = "../data/qe_scf.out"
projwfc = "../data/qe_projwfc_up.gz"

[model]
orbitals = { Pt = ["s", "p", "d"] }
bands_below = 5
bands_above = 0
neighbours = 4
hopping = "shell"
soc = true
overlap = false
fit_eta = true

[fit]
method = "ls"
starts = 8
seed = 0
refine_max_nfev = 300
fermi_weight = 10
fermi_window = 1
start_from = "../out/platinum_decay_fit.json"
