# Graphene, C s p with spin-orbit coupling: decay law, whole orbital families
# skfitter fit steps/decay.toml (from the example folder)

name = "graphene_decay"
output = "../out"

[dft]
code = "espresso"
xml = "../data/qe_bands.xml"
bands_in = "../data/qe_bands.in"
scf = "../data/qe_scf.out"
projwfc = "../data/qe_projwfc_up.gz"

[model]
orbitals = { C = ["s", "p"] }
bands_below = 4
bands_above = 1
neighbours = 3
hopping = "decay"
soc = true
overlap = true
fit_eta = true

[fit]
method = "ls"
starts = 8
seed = 0
refine_max_nfev = 300
fermi_weight = 10
fermi_window = 1
start_set = "harrison"

[fit.fix]
lambda_C_p = 0.00770962
