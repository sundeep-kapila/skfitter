# Graphene, C s p with spin-orbit coupling
# The model of the SKFitter paper (Table 1). The fit starts from the published parameters
# (reference/); skfitter fit gives the RMSE of the paper. See README.md for a fit from scratch.

name = "graphene"
output = "out"

[dft]
code = "espresso"
xml = "data/qe_bands.xml"
bands_in = "data/qe_bands.in"
scf = "data/qe_scf.out"
projwfc = "data/qe_projwfc_up.gz"

[model]
orbitals = { C = ["s", "p"] }
bands_below = 4
bands_above = 1
neighbours = 3
hopping = "shell"
soc = true
overlap = true
fit_eta = true

[fit]
method = "ls"
starts = 2
seed = 0
refine_max_nfev = 300
fermi_weight = 10
fermi_window = 1
start_from = "reference/graphene_fit.json"

[fit.fix]
lambda_C_p = 0.00770962
