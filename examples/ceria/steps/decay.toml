# CeO2, Ce d (t2g, eg) f (a2u, t1u, t2u) and O p: decay law, whole orbital families
# skfitter fit steps/decay.toml (from the example folder)

name = "ceria_decay"
output = "../out"

[dft]
code = "espresso"
xml = "../data/qe_bands.xml"
bands_in = "../data/qe_bands.in"
scf = "../data/qe_scf.out"
projwfc = "../data/qe_projwfc_up.gz"

[model]
orbitals = { Ce = ["d", "f"], O = ["p"] }
bands_below = 6
bands_above = 7
neighbours = 4
hopping = "decay"
soc = false
overlap = false
fit_eta = true

[fit]
method = "ls"
starts = 8
seed = 0
refine_max_nfev = 300
fermi_weight = 30
fermi_window = 1
start_set = "harrison"
