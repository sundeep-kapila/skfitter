# EuMn2Bi2: the orbitals the symmetry-split model (steps/split.toml) lacks, ranked from the projwfc.x projections over
# all k-points of the fitted bands (the suggestion table of the paper; paper/table_suggest.py):
#   skfitter character suggest.toml --suggest
# The model is that of steps/split.toml; reading the 290 MB projections takes a few minutes.

name = "eumn2bi2_split"
output = "out_suggest"

[dft]
code = "espresso"
xml = "data/qe_bands.xml.gz"
bands_in = "data/qe_bands.in"
scf = "data/qe_scf.out"
projwfc = "data/qe_projwfc_up.gz"

[model]
orbitals = { Eu = ["f"], Mn = ["dz2", "d_e1", "d_e2"], Bi = ["pz", "pxy"] }
magnetic_orbitals = { Eu = ["f"], Mn = ["dz2", "d_e1", "d_e2"] }
bands_below = 29
bands_above = 10
neighbours = 13
hopping = "shell"
soc = true
soc_orbitals = { Bi = ["p"] }
overlap = false
electrons = 58
fit_eta = false
eta = 2.5

[fit]
method = "ls"
starts = 2
seed = 0
refine_max_nfev = 300
fermi_weight = 10
fermi_window = 1.5
start_from = "out/eumn2bi2_shell_fit.json"

[fit.fix]
lambda_Bi_p = 1.251

[fit.bounds]
delta_spin_Eu_f = [8, 12]
delta_spin_Mn_dz2 = [3, 12]
delta_spin_Mn_d_e1 = [3, 12]
delta_spin_Mn_d_e2 = [3, 12]
