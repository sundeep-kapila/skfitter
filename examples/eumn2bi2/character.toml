# EuMn2Bi2: the orbital character of the DFT states at Γ (Fig. 5a), from the projwfc.x projections:
#   skfitter character character.toml --k Γ
# The model is that of skfitter.toml; reading the 290 MB projections takes a few minutes.

name = "eumn2bi2"
output = "out_character"

[dft]
code = "espresso"
xml = "data/qe_bands.xml.gz"
bands_in = "data/qe_bands.in"
scf = "data/qe_scf.out"
projwfc = "data/qe_projwfc_up.gz"

[model]
orbitals = { Eu = ["d", "f", "s"], Mn = ["s", "dz2", "d_e1", "d_e2"], Bi = ["s", "pz", "pxy"] }
magnetic_orbitals = { Eu = ["f"], Mn = ["dz2", "d_e1", "d_e2"] }
bands_below = 29
bands_above = 10
neighbours = 13
hopping = "shell"
soc = true
overlap = false
electrons = 66
fit_eta = false
eta = 2.5

