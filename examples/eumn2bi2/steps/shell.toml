# EuMn2Bi2, Eu d f, Mn s d (A1, E1, E2), Bi s pz / pxy, antiferromagnetic with SOC: per shell, whole orbital families
# skfitter fit steps/shell.toml (from the example folder)

name = "eumn2bi2_shell"
output = "../out"

[dft]
code = "espresso"
xml = "../data/qe_bands.xml.gz"
bands_in = "../data/qe_bands.in"
scf = "../data/qe_scf.out"

[model]
orbitals = { Eu = ["f"], Mn = ["d"], Bi = ["p"] }
magnetic_orbitals = { Eu = ["f"], Mn = ["d"] }
bands_below = 29
bands_above = 10
neighbours = 13
hopping = "shell"
soc = true
soc_orbitals = { Bi = ["p"] }
overlap = false
electrons = 58
fit_eta = false
eta = 2.5

[fit]
method = "ls"
starts = 2
seed = 0
refine_max_nfev = 300
fermi_weight = 10
fermi_window = 1.5
start_from = "../out/eumn2bi2_decay_fit.json"

[fit.fix]
lambda_Bi_p = 1.251

# exchange splitting of Mn 3d: >= 3 eV (the default bound, +-5 eV, is below its value of about 7 eV)
# exchange splitting of Eu 4f: >= 8 eV (lower values pull the empty 4f states into the conduction band,
# where DFT has none)
[fit.bounds]
delta_spin_Eu_f = [8, 12]
delta_spin_Mn_d = [3, 12]
